<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Album Out Now</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            background-color: #1db954;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Album</h1>
        <p>Listen now on your favorite platform</p>
        
        <a href="YOUR_SPOTIFY_ALBUM_URL" class="btn" target="_blank">Listen on Spotify</a>
    </div>
</body>
</html>
