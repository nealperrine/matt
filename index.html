<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt Fox Band - MATT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1533;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .wrapper {
            max-width: 1024px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        area {
            cursor: pointer;
        }
    </style>
    <!-- Script to make image map coordinates responsive on mobile screens -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
</head>
<body>

    <div class="wrapper">
        <img src="Matt Cover Streamer.jpeg" usemap="#streaming-map" alt="Matt Fox Band - MATT">

        <map name="streaming-map">
            <!-- Spotify (Top Left Button) -->
            <area shape="rect" coords="140,755,488,815" href="open.spotify.com/artist/3wqUaMA6wyUR7ok8ckFbN2?si=HmMp0sIXRJO2aGRDuJL_HQ" target="_blank" alt="Spotify">

            <!-- Apple Music (Top Right Button) -->
            <area shape="rect" coords="512,755,860,815" href="YOUR_APPLE_MUSIC_LINK" target="_blank" alt="Apple Music">

            <!-- Amazon Music (Middle Left Button) -->
            <area shape="rect" coords="140,828,488,885" href="YOUR_AMAZON_MUSIC_LINK" target="_blank" alt="Amazon Music">

            <!-- Bandcamp (Middle Right Button) -->
            <area shape="rect" coords="512,828,860,885" href="YOUR_BANDCAMP_LINK" target="_blank" alt="Bandcamp">

            <!-- YouTube Music (Bottom Left Button) -->
            <area shape="rect" coords="140,898,488,955" href="YOUR_YOUTUBE_MUSIC_LINK" target="_blank" alt="YouTube Music">

            <!-- Tidal (Bottom Right Button) -->
            <area shape="rect" coords="512,898,860,955" href="YOUR_TIDAL_LINK" target="_blank" alt="Tidal">
        </map>
    </div>

    <script>
        window.onload = function() {
            imageMapResize();
        };
    </script>

</body>
</html>
