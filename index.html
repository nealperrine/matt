<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt Fox Band - MATT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1533;
            color: #e5c158;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Dynamic Blurred Background using cover.jpeg */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('cover.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.4);
            transform: scale(1.15);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .album-art {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            margin-bottom: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .header-title {
            font-size: 18px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .album-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .sub-header {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e5c158;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 380px) {
            .links-grid {
                grid-template-columns: 1fr;
            }
        }

        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(18, 27, 64, 0.75);
            backdrop-filter: blur(8px);
            border: 1.5px solid #e5c158;
            border-radius: 10px;
            padding: 10px 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .platform-btn:hover {
            background-color: rgba(229, 193, 88, 0.25);
            transform: translateY(-2px);
        }

        .platform-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .listen-tag {
            background-color: #e5c158;
            color: #121b40;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Blurred Background Layer -->
    <div class="bg-blur"></div>

    <div class="container">
        <!-- Main Artwork -->
        <img src="cover.jpeg" alt="Matt Fox Band - MATT" class="album-art">

        <!-- Titles -->
        <div class="header-title">Matt Fox Band</div>
        <div class="album-title">MATT</div>

        <!-- Call to Action Subheading -->
        <div class="sub-header">Listen Now</div>

        <!-- Buttons -->
        <div class="links-grid">
            <a href="https://open.spotify.com/album/2zr4J8Euej1mPRnhiEhsF7?si=vL4rQpqQR5eY3AJJO-UQ1g" target="_blank" class="platform-btn">
                <span class="platform-name">Spotify</span>
                <span class="listen-tag">Listen</span>
            </a>

            <a href="https://music.apple.com/us/album/matt/6801153156" target="_blank" class="platform-btn">
                <span class="platform-name">Apple Music</span>
                <span class="listen-tag">Listen</span>
            </a>

            <a href="https://amazon.com/music/player/albums/B0HF51YD5R?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_GsAhzqTyQDRFkObmlWoXD2v36" target="_blank" class="platform-btn">
                <span class="platform-name">Amazon Music</span>
                <span class="listen-tag">Listen</span>
            </a>

            <a href="#" target="_blank" class="platform-btn">
                <span class="platform-name">Bandcamp</span>
                <span class="listen-tag">Listen</span>
            </a>

            <a href="https://www.youtube.com/watch?v=mfzyFsRyEto&list=OLAK5uy_nwPKFpLhGYZPKULtpDlAVwgm2Yj-8x1mE" target="_blank" class="platform-btn">
                <span class="platform-name">YouTube Music</span>
                <span class="listen-tag">Listen</span>
            </a>

            <a href="https://tidal.com/album/552070329/u" target="_blank" class="platform-btn">
                <span class="platform-name">Tidal</span>
                <span class="listen-tag">Listen</span>
            </a>
        </div>
    </div>

</body>
</html>
